# Local overrides: exposes ports directly, uses env var for DB password instead of Docker secret
services:
  openseldon-postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_PASSWORD_FILE: ""
    secrets: []

  openseldon-api:
    ports:
      - "8000:8000"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_PASSWORD_FILE: ""
    secrets: []

  openseldon-web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - openseldon-api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  openseldon-nginx:
    ports:
      - "8080:80"
