# Production overlay: exposes Caddy on ports 80 and 443.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d \
#          openseldon-postgres openseldon-api openseldon-caddy
#
# The web container is intentionally omitted — the frontend runs on Vercel.

services:
  openseldon-caddy:
    ports:
      - "80:80"
      - "443:443"
