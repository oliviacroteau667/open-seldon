name: Daily API Audit

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run audit script
        env:
          API_BASE_URL: ${{ secrets.PROD_API_URL }}
          API_KEY: ${{ secrets.PROD_API_KEY }}
        run: python scripts/api_audit.py

      - name: Open or update issue on failure
        id: issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily API audit failed';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit-failure',
            });
            let issue_number;
            if (issues.data.length > 0) {
              issue_number = issues.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: `Audit failed again on ${new Date().toISOString()}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['audit-failure'],
                body: `Automated API audit failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              issue_number = issue.data.number;
            }
            core.setOutput('issue_number', issue_number);

  remediate:
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Collect diagnostics and restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: false
          result_variables: DIAG
          script: |
            cd /root/open-seldon
            echo "=== CONTAINER STATUS ==="
            docker compose ps
            echo "=== API LOGS (last 50 lines) ==="
            docker compose logs --tail=50 openseldon-api
            echo "=== DISK USAGE ==="
            df -h /
            echo "=== RESTARTING DOWN CONTAINERS ==="
            # The prod overlay is what publishes Caddy's 80/443; omitting it recreates Caddy with no host ports
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "=== POST-RESTART STATUS ==="
            docker compose ps

      - name: Post diagnostics to issue
        if: always()
        uses: actions/github-script@v7
        env:
          DIAG: ${{ env.DIAG }}
          ISSUE_NUMBER: ${{ needs.audit.outputs.issue_number }}
        with:
          script: |
            const issue_number = parseInt(process.env.ISSUE_NUMBER);
            if (!issue_number) return;
            const diag = process.env.DIAG || '(no output captured)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `## Auto-remediation ran\n\n\`\`\`\n${diag.slice(0, 60000)}\n\`\`\`\n\nContainers restarted if any were down. Re-audit will run tomorrow or trigger manually.`,
            });
