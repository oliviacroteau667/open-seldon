version: 1
metadata:
  name: Open Seldon Branding
entries:
  - model: authentik_brands.brand
    state: present
    id: openseldon-brand
    attrs:
      domain: accounts.openseldon.org
      branding_title: Open Seldon
      branding_logo: /static/dist/assets/icons/icon_left_brand.svg
      branding_favicon: /static/dist/assets/icons/icon.png
      flow_authentication: !Find [authentik_flows.flow, [slug, openseldon-authentication]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, openseldon-invalidation]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      custom_css: |
        :root {
          --ak-bg: #0b0a14;
          --ak-card-bg: #1a1829;
          --ak-border: #2e2a4a;
          --ak-primary: #8b7cf6;
          --ak-primary-hover: #7c6ee0;
          --ak-text: #e2e8f0;
          --ak-text-muted: #94a3b8;
          --ak-input-bg: #0f0e1a;
        }

        body,
        .pf-v5-c-login,
        .pf-v5-c-page {
          background: var(--ak-bg) !important;
        }

        .pf-v5-c-login__main {
          background: var(--ak-card-bg) !important;
          border: 1px solid var(--ak-border) !important;
          border-radius: 12px !important;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
        }

        .pf-v5-c-title,
        .pf-v5-c-login__main-header-desc,
        label,
        p {
          color: var(--ak-text) !important;
        }

        .pf-v5-c-form-control {
          background: var(--ak-input-bg) !important;
          border-color: var(--ak-border) !important;
          color: var(--ak-text) !important;
        }

        .pf-v5-c-form-control:focus {
          border-color: var(--ak-primary) !important;
          outline-color: var(--ak-primary) !important;
        }

        .pf-v5-c-button.pf-m-primary {
          background: var(--ak-primary) !important;
          border-color: var(--ak-primary) !important;
          color: #fff !important;
        }

        .pf-v5-c-button.pf-m-primary:hover {
          background: var(--ak-primary-hover) !important;
          border-color: var(--ak-primary-hover) !important;
        }

        .pf-v5-c-login__footer {
          color: var(--ak-text-muted) !important;
        }

        a {
          color: var(--ak-primary) !important;
        }

  # Sign-out (invalidation) flow
  - model: authentik_stages_user_logout.userlogoutstage
    state: present
    id: openseldon-logout-stage
    attrs:
      name: openseldon-logout

  - model: authentik_flows.flow
    state: present
    id: openseldon-invalidation-flow
    attrs:
      name: Open Seldon Sign Out
      title: Signing out…
      slug: openseldon-invalidation
      designation: invalidation
      authentication: require_authenticated

  - model: authentik_flows.flowstagebinding
    state: present
    id: bind-invalidation-logout
    attrs:
      target: !KeyOf openseldon-invalidation-flow
      stage: !KeyOf openseldon-logout-stage
      order: 10
